services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: lembrazap_user
      POSTGRES_PASSWORD: password_segura
      POSTGRES_DB: lembrazap
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Sem `ports:` de propósito. Só o backend fala com o banco, pela rede
    # interna do compose. Publicar 5432 na host ocupa porta e expõe o banco.
    # Para depurar: docker compose exec db psql -U lembrazap_user -d lembrazap
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lembrazap_user -d lembrazap"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: always
    # Sem `ports:` pela mesma razão do Postgres.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    # O entrypoint do Dockerfile roda `alembic upgrade head` antes do uvicorn.
    # Sem --reload: em produção o código vem da imagem. Para recarregar no
    # desenvolvimento, use docker-compose.dev.yml.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Host 8002 -> container 8000. O 8000 da host já é usado pelo aletheia_backend
    # na VPS de produção, então o mapeamento precisa ser explícito e diferente.
    # O container continua escutando em 8000; quem fala com ele usa o nome do
    # serviço (backend:8000), não a porta da host.
    ports:
      - "8002:8000"
    # SEM bind mount de propósito. Montar ./backend:/app sobrescreve a imagem
    # com o código da host — em produção isso anula o build e faz o container
    # usar os arquivos da checkout local, não os da imagem.
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://lembrazap_user:password_segura@db:5432/lembrazap
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  worker:
    build: ./backend
    # Sem o entrypoint: as migrations são aplicadas só pelo backend, e o worker
    # espera o backend ficar healthy para não subir contra o schema antigo.
    entrypoint: []
    command: ["celery", "-A", "app.worker.celery_app", "worker", "-B", "--loglevel=info"]
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://lembrazap_user:password_segura@db:5432/lembrazap
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data: