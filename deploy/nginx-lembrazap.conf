# =============================================================================
#  LembraZap — vhost para o OpenResty do painel iContainer (VPS de produção)
#
#  ATENÇÃO: este host NÃO é um nginx de instalação comum. O OpenResty roda em
#  container com `network_mode: host`, gerenciado pelo painel iContainer.
#  Consequências:
#    - Os configs vão em conf.d/<dominio>.conf (um arquivo por subdomínio)
#    - Logs em /www/sites/<dominio>/log/
#    - Certificados em /www/sites/<dominio>/ssl/
#    - `proxy_pass` para 127.0.0.1:<porta> FUNCIONA (o container usa rede host)
#
#  COMO PUBLICAR
#    1. Criar os diretórios do site:
#       SITE=/etc/icontainer/apps/openresty/openresty/www/sites/lembrazap.aletheia.ia.br
#       mkdir -p $SITE/{log,ssl,index}
#    2. Bootstrap: copie nginx-lembrazap-http.conf (só HTTP) para
#       conf.d/lembrazap.aletheia.ia.br.conf e recarregue — isso libera o
#       desafio do ACME.
#    3. Emitir o certificado (o painel só tem wildcard de *.ia.br, não de
#       *.aletheia.ia.br, então este subdomínio precisa do próprio).
#       O webroot PRECISA ser o diretório host que corresponde ao
#       `root /usr/share/nginx/html` do location de challenge acima, senão o
#       Let's Encrypt não encontra o arquivo e a emissão falha:
#       mkdir -p /etc/icontainer/apps/openresty/openresty/root/.well-known/acme-challenge
#       certbot certonly --webroot \
#         -w /etc/icontainer/apps/openresty/openresty/root \
#         -d lembrazap.aletheia.ia.br
#       cp /etc/letsencrypt/live/lembrazap.aletheia.ia.br/{fullchain,privkey}.pem $SITE/ssl/
#
#       O OpenResty NÃO lê /etc/letsencrypt/live/. Como a renovação é automática,
#       o cert em $SITE/ssl ficaria velho. Registre um hook de deploy:
#       /etc/letsencrypt/renewal-hooks/deploy/lembrazap-openresty.sh  → copia os
#       dois arquivos para $SITE/ssl e roda `openresty -t` + `openresty -s reload`.
#    4. Substituir por ESTE arquivo (versão HTTPS) e recarregar:
#       cp deploy/nginx-lembrazap.conf \
#          /etc/icontainer/apps/openresty/openresty/conf/conf.d/lembrazap.aletheia.ia.br.conf
#       docker exec ic-openresty-wQHe openresty -t     # valida ANTES
#       docker exec ic-openresty-wQHe openresty -s reload
#    5. Publicar o painel (frontend buildado) em $SITE/index:
#       cd frontend && npm ci && npm run build
#       cp -r dist/* $SITE/index/
#
#  PORTA 8002: o host 8000 já é do aletheia_backend nesta VPS.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name lembrazap.aletheia.ia.br;

    # ---------------------------------------------------------------- LOGS
    access_log /www/sites/lembrazap.aletheia.ia.br/log/access.log main;
    error_log  /www/sites/lembrazap.aletheia.ia.br/log/error.log;

    # ------------------------------------------------- DESAFIO DO LET'S ENCRYPT
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # ------------------------------------------------- REDIRECIONA PARA HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lembrazap.aletheia.ia.br;

    # ---------------------------------------------------------------- LOGS
    access_log /www/sites/lembrazap.aletheia.ia.br/log/access.log main;
    error_log  /www/sites/lembrazap.aletheia.ia.br/log/error.log;

    # ------------------------------------------------------- CERTIFICADOS
    # Emitidos por subdomínio — não existe wildcard para *.aletheia.ia.br.
    ssl_certificate     /www/sites/lembrazap.aletheia.ia.br/ssl/fullchain.pem;
    ssl_certificate_key /www/sites/lembrazap.aletheia.ia.br/ssl/privkey.pem;
    ssl_protocols TLSv1.3 TLSv1.2;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    # Raiz do build do frontend (npm run build -> frontend/dist).
    root /www/sites/lembrazap.aletheia.ia.br/index;
    index index.html;
    client_max_body_size 10m;

    # ------------------------------------------------- API (backend :8002)
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;

        # Painel e API na mesma origem, então CORS não é estritamente necessário.
        # Mantido caso o frontend venha a ser servido de outro host.
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, X-LZ-Token, Authorization' always;

        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, X-LZ-Token, Authorization';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # ------------------------------------- HEALTHCHECK E SWAGGER (backend :8002)
    location ~ ^/(healthz|docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------ PAINEL (SPA do frontend)
    # Qualquer rota desconhecida cai no index.html para o roteamento do React.
    location / {
        try_files $uri $uri/ /index.html;
    }
}