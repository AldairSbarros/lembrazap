# ─────────────────────────────────────────────────────────────────────────────
# LembraZap — server block para o nginx/OpenResty do HOST na VPS.
#
# COMO USAR:
#   Cole este bloco no FIM do arquivo `default` do nginx (depois do server do
#   api.aletheia.ia.br), como um `server` IRMÃO dos existentes — NUNCA dentro do
#   bloco do aletheia.ia.br. É HTTP de propósito: o certbot adiciona o 443/SSL.
#
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d lembrazap.aletheia.ia.br
#
# Pré-requisitos:
#   - Registro DNS A: lembrazap -> IP público da VPS
#   - Container no ar publicando 127.0.0.1:8050 (docker compose up -d)
#   - proxy_pass SEM barra no fim: o subdomínio já é a raiz (não há prefixo).
# ─────────────────────────────────────────────────────────────────────────────

# --- LEMBRAZAP (subdomínio isolado — não interfere nos blocos do AletheIA) ---
server {
    listen 80;
    listen [::]:80;
    server_name lembrazap.aletheia.ia.br;

    location / {
        proxy_pass http://127.0.0.1:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
    }
}
