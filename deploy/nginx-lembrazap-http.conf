# =============================================================================
#  VERSÃO TEMPORÁRIA — só HTTP, usada APENAS para o bootstrap do certificado.
#
#  Motivo: o bloco HTTPS não sobe sem os arquivos de certificado existirem.
#  Então o emitidor do ACME (Let's Encrypt) precisa de um vhost HTTP que
#  responda em /.well-known/acme-challenge/ antes do primeiro reload.
#
#  Uso:
#    SITE=/etc/icontainer/apps/openresty/openresty/www/sites/lembrazap.aletheia.ia.br
#    mkdir -p $SITE/{log,ssl,index}
#    cp deploy/nginx-lembrazap-http.conf \
#       /etc/icontainer/apps/openresty/openresty/conf/conf.d/lembrazap.aletheia.ia.br.conf
#    docker exec ic-openresty-wQHe openresty -t
#    docker exec ic-openresty-wQHe openresty -s reload
#
#    certbot certonly --webroot -w $SITE/index -d lembrazap.aletheia.ia.br
#
#  TROQUE ESTE ARQUIVO pelo nginx-lembrazap.conf assim que o cert existir.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name lembrazap.aletheia.ia.br;

    access_log /www/sites/lembrazap.aletheia.ia.br/log/access.log main;
    error_log  /www/sites/lembrazap.aletheia.ia.br/log/error.log;

    # Desafio do ACME — precisa funcionar antes de haver certificado.
    location ^~ /.well-known/acme-challenge {
        allow all;
        root /usr/share/nginx/html;
    }

    # API já responde por HTTP durante o bootstrap (útil para testar o deploy).
    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(healthz|docs|redoc|openapi\.json)$ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Sem certificado ainda, não redireciona: serve o que houver em index/.
    location / {
        root /www/sites/lembrazap.aletheia.ia.br/index;
        try_files $uri $uri/ /index.html;
    }
}